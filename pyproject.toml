[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["ultralytics.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["cv2.*", "yaml.*"]
ignore_missing_imports = true
